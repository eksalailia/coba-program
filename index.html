<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Learning Informatika Kelas 7</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body { background:#f0f4f8; color:#2d3748; min-height:100vh; }

  header {
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:#fff; padding:18px 24px; display:flex; justify-content:space-between;
    align-items:center; box-shadow:0 2px 10px rgba(0,0,0,.15); flex-wrap:wrap; gap:10px;
  }
  header h1 { font-size:20px; }
  .tabs { display:flex; gap:8px; }
  .tab-btn {
    background:rgba(255,255,255,.2); border:none; color:#fff; padding:8px 16px;
    border-radius:8px; cursor:pointer; font-weight:600; transition:.2s;
  }
  .tab-btn:hover { background:rgba(255,255,255,.35); }
  .tab-btn.active { background:#fff; color:#667eea; }

  main { max-width:1100px; margin:24px auto; padding:0 16px; }
  .page { display:none; }
  .page.active { display:block; animation:fade .3s; }
  @keyframes fade { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

  .card {
    background:#fff; border-radius:12px; padding:20px; margin-bottom:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
  }
  h2 { font-size:18px; margin-bottom:14px; color:#4a5568; border-left:4px solid #667eea; padding-left:10px; }
  h3 { font-size:15px; margin-bottom:8px; color:#2d3748; }

  label { display:block; font-size:13px; font-weight:600; margin:10px 0 5px; color:#4a5568; }
  input[type=text], input[type=file], textarea, select {
    width:100%; padding:9px 12px; border:1.5px solid #e2e8f0; border-radius:8px;
    font-size:14px; outline:none; transition:.2s; background:#fff;
  }
  input:focus, textarea:focus, select:focus { border-color:#667eea; }
  textarea { min-height:80px; resize:vertical; font-family:inherit; }

  .btn {
    background:#667eea; color:#fff; border:none; padding:10px 18px; border-radius:8px;
    cursor:pointer; font-weight:600; font-size:14px; transition:.2s; margin-top:10px;
  }
  .btn:hover { background:#5a67d8; transform:translateY(-1px); }
  .btn-danger { background:#e53e3e; }
  .btn-danger:hover { background:#c53030; }
  .btn-success { background:#38a169; }
  .btn-success:hover { background:#2f855a; }
  .btn-sm { padding:6px 12px; font-size:12px; margin:0; }

  .item {
    background:#f7fafc; border:1px solid #e2e8f0; border-radius:10px;
    padding:14px; margin-bottom:12px; display:flex; justify-content:space-between;
    align-items:flex-start; gap:12px; flex-wrap:wrap;
  }
  .item-info { flex:1; min-width:200px; }
  .item-info strong { display:block; font-size:15px; margin-bottom:4px; }
  .item-info small { color:#718096; font-size:12px; }
  .item-actions { display:flex; gap:6px; flex-wrap:wrap; }

  .badge {
    display:inline-block; background:#667eea; color:#fff; font-size:11px;
    padding:3px 9px; border-radius:20px; font-weight:600; margin-bottom:6px;
  }
  .badge.quiz { background:#ed8936; }

  .empty { text-align:center; color:#a0aec0; padding:30px; font-size:14px; }

  .question { margin-bottom:20px; padding-bottom:16px; border-bottom:1px dashed #e2e8f0; }
  .question p { font-weight:600; margin-bottom:10px; }
  .option {
    display:block; padding:10px 14px; border:1.5px solid #e2e8f0; border-radius:8px;
    margin-bottom:8px; cursor:pointer; transition:.2s; font-size:14px;
  }
  .option:hover { border-color:#667eea; background:#f7fafc; }
  .option input { margin-right:8px; }

  .result-box {
    text-align:center; padding:24px; border-radius:12px;
    background:linear-gradient(135deg,#667eea,#764ba2); color:#fff;
  }
  .result-box .score { font-size:48px; font-weight:800; margin:10px 0; }

  #pdfModal {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.8);
    z-index:1000; padding:20px;
  }
  #pdfModal .modal-content {
    background:#fff; max-width:900px; height:90vh; margin:0 auto; border-radius:12px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  #pdfModal .modal-header {
    padding:14px 18px; background:#667eea; color:#fff;
    display:flex; justify-content:space-between; align-items:center;
  }
  #pdfModal iframe { flex:1; border:none; width:100%; }

  .notice {
    background:#fefcbf; border-left:4px solid #ecc94b; padding:12px;
    border-radius:6px; font-size:13px; color:#744210; margin-bottom:16px;
  }

  @media(max-width:600px) {
    header { flex-direction:column; align-items:flex-start; }
    .tabs { width:100%; }
    .tab-btn { flex:1; font-size:12px; padding:8px; }
  }
</style>
</head>
<body>

<header>
  <h1>🎓 E-Learning Informatika — Kelas 7</h1>
  <div class="tabs">
    <button class="tab-btn active" data-tab="siswa">📚 Belajar</button>
    <button class="tab-btn" data-tab="admin">⚙️ Admin Guru</button>
  </div>
</header>

<main>
  <div id="page-siswa" class="page active">
    <div class="notice">💡 Modul & soal diupload oleh guru melalui tab <b>Admin Guru</b>. Data tersimpan di browser ini.</div>
    <div class="card">
      <h2>📖 Modul Pembelajaran</h2>
      <div id="modulListSiswa"></div>
    </div>
    <div class="card">
      <h2>📝 Latihan Soal</h2>
      <div id="quizListSiswa"></div>
    </div>
    <div id="quizArea"></div>
  </div>

  <div id="page-admin" class="page">
    <div class="card">
      <h2>📤 Upload Modul</h2>
      <label>Judul Modul</label>
      <input type="text" id="modulJudul" placeholder="Contoh: Pengenalan Perangkat Komputer">
      <label>Deskripsi Singkat</label>
      <textarea id="modulDesk" placeholder="Deskripsi modul..."></textarea>
      <label>File Modul (PDF, DOC, PPT, gambar)</label>
      <input type="file" id="modulFile" accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png">
      <button class="btn" onclick="simpanModul()">➕ Tambah Modul</button>
      <div id="modulListAdmin" style="margin-top:20px;"></div>
    </div>

    <div class="card">
      <h2>📝 Buat Kuis</h2>
      <label>Judul Kuis</label>
      <input type="text" id="quizJudul" placeholder="Contoh: Kuis 1 - Hardware & Software">
      <label>Deskripsi</label>
      <input type="text" id="quizDesk" placeholder="Deskripsi singkat kuis">
      <div id="soalContainer"></div>
      <button class="btn btn-success" onclick="tambahSoalForm()">➕ Tambah Soal</button>
      <button class="btn" onclick="simpanKuis()">💾 Simpan Kuis</button>
      <div id="quizListAdmin" style="margin-top:20px;"></div>
    </div>
  </div>
</main>

<div id="pdfModal">
  <div class="modal-content">
    <div class="modal-header">
      <strong id="pdfTitle">Modul</strong>
      <button class="btn btn-sm btn-danger" onclick="closePdf()">✕ Tutup</button>
    </div>
    <iframe id="pdfFrame"></iframe>
  </div>
</div>

<script>
const DB = {
  getModul: () => JSON.parse(localStorage.getItem('el_modul') || '[]'),
  setModul: (d) => localStorage.setItem('el_modul', JSON.stringify(d)),
  getKuis: () => JSON.parse(localStorage.getItem('el_kuis') || '[]'),
  setKuis: (d) => localStorage.setItem('el_kuis', JSON.stringify(d)),
  getNilai: () => JSON.parse(localStorage.getItem('el_nilai') || '[]'),
  setNilai: (d) => localStorage.setItem('el_nilai', JSON.stringify(d))
};

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-' + btn.dataset.tab).classList.add('active');
    renderSiswa();
    renderAdmin();
    document.getElementById('quizArea').innerHTML = '';
  };
});

function simpanModul() {
  const judul = document.getElementById('modulJudul').value.trim();
  const desk  = document.getElementById('modulDesk').value.trim();
  const file  = document.getElementById('modulFile').files[0];

  if (!judul) return alert('Judul modul wajib diisi!');
  if (!file)  return alert('File modul wajib dipilih!');

  const reader = new FileReader();
  reader.onload = (e) => {
    const modul = DB.getModul();
    modul.push({
      id: Date.now(),
      judul, desk,
      namaFile: file.name,
      tipe: file.type,
      data: e.target.result,
      tanggal: new Date().toLocaleDateString('id-ID')
    });
    DB.setModul(modul);
    document.getElementById('modulJudul').value = '';
    document.getElementById('modulDesk').value = '';
    document.getElementById('modulFile').value = '';
    renderAdmin();
    renderSiswa();
    alert('✅ Modul berhasil diupload!');
  };
  reader.readAsDataURL(file);
}

function hapusModul(id) {
  if (!confirm('Hapus modul ini?')) return;
  DB.setModul(DB.getModul().filter(m => m.id !== id));
  renderAdmin(); renderSiswa();
}

function bukaModul(id) {
  const m = DB.getModul().find(x => x.id === id);
  if (!m) return;
  if (m.tipe.includes('pdf') || m.tipe.includes('image')) {
    document.getElementById('pdfTitle').textContent = m.judul;
    document.getElementById('pdfFrame').src = m.data;
    document.getElementById('pdfModal').style.display = 'block';
  } else {
    const a = document.createElement('a');
    a.href = m.data;
    a.download = m.namaFile;
    a.click();
  }
}

function closePdf() {
  document.getElementById('pdfModal').style.display = 'none';
  document.getElementById('pdfFrame').src = '';
}

let soalCounter = 0;

function tambahSoalForm() {
  soalCounter++;
  const id = 'soal_' + soalCounter;
  const div = document.createElement('div');
  div.className = 'card';
  div.style.background = '#f7fafc';
  div.id = id;
  div.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <h3>Soal ${soalCounter}</h3>
      <button class="btn btn-sm btn-danger" onclick="document.getElementById('${id}').remove()">Hapus</button>
    </div>
    <label>Pertanyaan</label>
    <textarea class="q-text" placeholder="Tulis pertanyaan..."></textarea>
    <label>Pilihan A</label><input type="text" class="q-a">
    <label>Pilihan B</label><input type="text" class="q-b">
    <label>Pilihan C</label><input type="text" class="q-c">
    <label>Pilihan D</label><input type="text" class="q-d">
    <label>Jawaban Benar</label>
    <select class="q-key">
      <option value="A">A</option><option value="B">B</option>
      <option value="C">C</option><option value="D">D</option>
    </select>
  `;
  document.getElementById('soalContainer').appendChild(div);
}

function simpanKuis() {
  const judul = document.getElementById('quizJudul').value.trim();
  const desk  = document.getElementById('quizDesk').value.trim();
  if (!judul) return alert('Judul kuis wajib diisi!');

  const soalEls = document.querySelectorAll('#soalContainer .card');
  if (soalEls.length === 0) return alert('Tambahkan minimal 1 soal!');

  const soal = [];
  for (let el of soalEls) {
    const text = el.querySelector('.q-text').value.trim();
    const a = el.querySelector('.q-a').value.trim();
    const b = el.querySelector('.q-b').value.trim();
    const c = el.querySelector('.q-c').value.trim();
    const d = el.querySelector('.q-d').value.trim();
    const key = el.querySelector('.q-key').value;
    if (!text || !a || !b || !c || !d) {
      return alert('Semua field soal & pilihan harus diisi!');
    }
    soal.push({ text, a, b, c, d, key });
  }

  const kuis = DB.getKuis();
  kuis.push({
    id: Date.now(),
    judul, desk, soal,
    tanggal: new Date().toLocaleDateString('id-ID')
  });
  DB.setKuis(kuis);

  document.getElementById('quizJudul').value = '';
  document.getElementById('quizDesk').value = '';
  document.getElementById('soalContainer').innerHTML = '';
  soalCounter = 0;
  renderAdmin(); renderSiswa();
  alert('✅ Kuis berhasil disimpan!');
}

function hapusKuis(id) {
  if (!confirm('Hapus kuis ini?')) return;
  DB.setKuis(DB.getKuis().filter(k => k.id !== id));
  renderAdmin(); renderSiswa();
}

function renderAdmin() {
  const modul = DB.getModul();
  document.getElementById('modulListAdmin').innerHTML = modul.length === 0
    ? '<div class="empty">Belum ada modul.</div>'
    : modul.map(m => `
      <div class="item">
        <div class="item-info">
          <span class="badge">📖 Modul</span>
          <strong>${m.judul}</strong>
          <small>${m.namaFile} • ${m.tanggal}</small>
          ${m.desk ? '<br><small>'+m.desk+'</small>' : ''}
        </div>
        <div class="item-actions">
          <button class="btn btn-sm" onclick="bukaModul(${m.id})">👁 Lihat</button>
          <button class="btn btn-sm btn-danger" onclick="hapusModul(${m.id})">🗑</button>
        </div>
      </div>`).join('');

  const kuis = DB.getKuis();
  document.getElementById('quizListAdmin').innerHTML = kuis.length === 0
    ? '<div class="empty">Belum ada kuis.</div>'
    : kuis.map(k => `
      <div class="item">
        <div class="item-info">
          <span class="badge quiz">📝 Kuis</span>
          <strong>${k.judul}</strong>
          <small>${k.soal.length} soal • ${k.tanggal}</small>
        </div>
        <div class="item-actions">
          <button class="btn btn-sm btn-danger" onclick="hapusKuis(${k.id})">🗑</button>
        </div>
      </div>`).join('');
}

function renderSiswa() {
  const modul = DB.getModul();
  document.getElementById('modulListSiswa').innerHTML = modul.length === 0
    ? '<div class="empty">Belum ada modul yang diupload guru.</div>'
    : modul.map(m => `
      <div class="item">
        <div class="item-info">
          <span class="badge">📖 Modul</span>
          <strong>${m.judul}</strong>
          <small>${m.namaFile}</small>
          ${m.desk ? '<br><small>'+m.desk+'</small>' : ''}
        </div>
        <div class="item-actions">
          <button class="btn btn-sm" onclick="bukaModul(${m.id})">📂 Buka</button>
        </div>
      </div>`).join('');

  const kuis = DB.getKuis();
  document.getElementById('quizListSiswa').innerHTML = kuis.length === 0
    ? '<div class="empty">Belum ada kuis.</div>'
    : kuis.map(k => `
      <div class="item">
        <div class="item-info">
          <span class="badge quiz">📝 Kuis</span>
          <strong>${k.judul}</strong>
          <small>${k.soal.length} soal</small>
        </div>
        <div class="item-actions">
          <button class="btn btn-sm" onclick="mulaiKuis(${k.id})">▶ Kerjakan</button>
        </div>
      </div>`).join('');
}

function mulaiKuis(id) {
  const kuis = DB.getKuis().find(k => k.id === id);
  if (!kuis) return;

  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="card">
      <h2>📝 ${kuis.judul}</h2>
      <p style="color:#718096;font-size:13px;margin-bottom:16px;">${kuis.desk || ''}</p>
      <form id="formKuis">
        ${kuis.soal.map((s, i) => `
          <div class="question">
            <p>${i+1}. ${s.text}</p>
            <label class="option"><input type="radio" name="q${i}" value="A"> A. ${s.a}</label>
            <label class="option"><input type="radio" name="q${i}" value="B"> B. ${s.b}</label>
            <label class="option"><input type="radio" name="q${i}" value="C"> C. ${s.c}</label>
            <label class="option"><input type="radio" name="q${i}" value="D"> D. ${s.d}</label>
          </div>`).join('')}
        <button type="submit" class="btn btn-success">✅ Kumpulkan Jawaban</button>
      </form>
    </div>`;

  document.getElementById('formKuis').onsubmit = (e) => {
    e.preventDefault();
    let benar = 0;
    kuis.soal.forEach((s, i) => {
      const picked = document.querySelector(`input[name="q${i}"]:checked`);
      if (picked && picked.value === s.key) benar++;
    });
    const skor = Math.round((benar / kuis.soal.length) * 100);

    area.innerHTML = `
      <div class="card">
        <div class="result-box">
          <h2 style="color:#fff;border:none;padding:0;">Hasil Kuis: ${kuis.judul}</h2>
          <div class="score">${skor}</div>
          <p>Benar ${benar} dari ${kuis.soal.length} soal</p>
          <p style="margin-top:8px;font-size:14px;">
            ${skor >= 75 ? '🎉 Hebat! Pertahankan!' : skor >= 50 ? '👍 Cukup baik, tingkatkan lagi!' : '💪 Belajar lagi ya!'}
          </p>
        </div>
        <button class="btn" style="margin-top:16px;" onclick="document.getElementById('quizArea').innerHTML=''; renderSiswa();">🔙 Kembali</button>
      </div>`;

    const nilai = DB.getNilai();
    nilai.push({ kuis: kuis.judul, skor, tanggal: new Date().toLocaleString('id-ID') });
    DB.setNilai(nilai);
  };

  area.scrollIntoView({ behavior: 'smooth' });
}

renderSiswa();
renderAdmin();
</script>
</body>
</html>
